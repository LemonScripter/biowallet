server {
    listen 80;
    server_name biowallet.metaspace.bio;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name biowallet.metaspace.bio;

    root /var/www/biowallet;
    index app/index.html;

    ssl_certificate /etc/letsencrypt/live/biowallet.metaspace.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biowallet.metaspace.bio/privkey.pem;

    # Biztonsági fejlécek — server szinten (location blokkok öröklik)
    # FIGYELEM: ha location blokkban is van add_header, az felülírja a szülőt.
    # Ezért: Cache-Control = expires direktívával, add_header nélkül.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com https://eth.llamarpc.com; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header Permissions-Policy       "camera=(self)" always;

    # Vendor JS: 30 nap (expires = Cache-Control auto)
    location ~* ^/vendor/.*\.js$ {
        expires 30d;
    }

    # Általános statikus fájlok: 7 nap
    location ~* \.(js|css|png|ico|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /app/index.html;
        expires -1;
    }
}
